<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f3f6f5"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="64" font-size="34" fill="#15242c" font-weight="bold">Читаем код 36 по шагам</text><rect x="90" y="108" width="460" height="355" rx="22" fill="white" stroke="#d5dfe2"/><text x="320" y="270" font-size="150" fill="#157f6b" text-anchor="middle" font-weight="bold">3</text><text x="320" y="320" font-size="18" fill="#157f6b" text-anchor="middle">ПЕРВАЯ ЦИФРА</text><text x="320" y="358" font-size="21" fill="#15242c" text-anchor="middle">Нижняя челюсть,</text><text x="320" y="396" font-size="21" fill="#15242c" text-anchor="middle">слева у пациента</text><rect x="650" y="108" width="460" height="355" rx="22" fill="white" stroke="#d5dfe2"/><text x="880" y="270" font-size="150" fill="#bf3557" text-anchor="middle" font-weight="bold">6</text><text x="880" y="320" font-size="18" fill="#bf3557" text-anchor="middle">ВТОРАЯ ЦИФРА</text><text x="880" y="358" font-size="21" fill="#15242c" text-anchor="middle">Шестая позиция от средней линии:</text><text x="880" y="396" font-size="21" fill="#15242c" text-anchor="middle">первый постоянный моляр</text><text x="55" y="517" font-size="28" fill="#15242c" font-weight="bold">36 = нижний левый первый постоянный моляр.</text></g></svg>