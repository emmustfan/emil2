name: emil2-production
x-runtime: &runtime
  image: ${APP_IMAGE:-emil2:local}
  build:
    context: .
    dockerfile: Dockerfile.production
    target: production
  env_file: .env.production
  environment:
    NODE_ENV: production
    TRUST_PROXY: "true"
    NODE_OPTIONS: --max-old-space-size=1024
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /app/tmp:size=128m,uid=1000,gid=1000,mode=0700
    - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [internal, egress]
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dental
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    mem_limit: 1536m
    command:
      ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dental"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: ${MIGRATE_IMAGE:-emil2-migrate:local}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: migrate
    env_file: .env.production
    environment: { NODE_ENV: production, TRUST_PROXY: "true" }
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [maintenance]
  web:
    <<: *runtime
    mem_limit: 1536m
    deploy:
      replicas: 3
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *runtime
    mem_limit: 1g
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      NODE_OPTIONS: --max-old-space-size=512
    command: ["pnpm", "worker"]
  caddy:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    image: caddy:2.10.2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      NO_PROXY: "${NO_PROXY:-},web,postgres,localhost,127.0.0.1"
    volumes:
      - ./infra/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [egress]
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
volumes:
  postgres:
  caddy_data:
  caddy_config:
networks:
  internal: { internal: true }
  egress:
